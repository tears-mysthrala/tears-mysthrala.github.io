<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Kurogane Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14151a"/>
      <stop offset="50%" stop-color="#0f1013"/>
      <stop offset="100%" stop-color="#090a0c"/>
    </linearGradient>

    <!-- Akkorokamui Crimson & Raijin Gold -->
    <linearGradient id="akkoro-raijin" x1="100" y1="100" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e04848"/>
      <stop offset="50%" stop-color="#d99036"/>
      <stop offset="100%" stop-color="#f5f4ef"/>
    </linearGradient>

    <radialGradient id="ember-glow" cx="950" cy="180" r="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c43434" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#ember-glow)"/>

  <!-- Forged Iron Frame (Kurogane) -->
  <rect x="36" y="36" width="1128" height="558" rx="14" fill="none" stroke="#2d303b" stroke-width="1.5"/>
  <rect x="42" y="42" width="1116" height="546" rx="10" fill="none" stroke="#1d1f26" stroke-width="1"/>

  <!-- Emblem -->
  <g transform="translate(90, 85) scale(1.35)">
    <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" fill="#181a20" stroke="#3f4553" stroke-width="2" stroke-linejoin="round"/>
    <path d="M32 16L46 25V39L32 48L18 39V25L32 16Z" fill="#121316" stroke="#c43434" stroke-width="2" stroke-linejoin="round"/>
    <path d="M34 22L26 33H33L30 42L40 30H32L35 22H34Z" fill="#d99036"/>
    <circle cx="32" cy="11" r="2" fill="#f5f4ef"/>
  </g>

  <!-- Badge / Sigil -->
  <rect x="195" y="98" width="310" height="34" rx="4" fill="#1c1e26" stroke="#c43434" stroke-width="1" opacity="0.85"/>
  <text x="210" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e04848" letter-spacing="2">MYSTHRALA KUROGANE DEFENSE LABS</text>

  <!-- Title (Benten Silk White) -->
  <text x="90" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#f5f4ef" letter-spacing="-1.5">
    Kalista — Tears Mysthrala
  </text>

  <!-- Subtitle (Raijin Gold & Akkorokamui Red) -->
  <text x="90" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="600" fill="#d99036">
    Empresaria · Consultora de Seguridad OT/ICS · Artesana de Sistemas
  </text>

  <!-- Description -->
  <text x="90" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#cfcbbe" line-height="1.5">
    Defensa técnica, soberanía operativa y resiliencia para el tejido industrial.
  </text>
  <text x="90" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#8a867b">
    Pragmatismo de planta, rigor forense y desarrollo de software local-first.
  </text>

  <!-- Footer Info -->
  <line x1="90" y1="480" x2="1110" y2="480" stroke="#2d303b" stroke-width="1"/>
  <text x="90" y="530" font-family="monospace" font-size="18" fill="#e04848">mysthrala.com</text>
  <text x="360" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#8a867b">Kurogane · Akkorokamui · Benten · Raijin</text>
  <text x="820" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#cfcbbe">Castellano · Euskara · English</text>
</svg>
