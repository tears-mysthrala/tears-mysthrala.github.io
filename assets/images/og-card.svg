<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      .serif { font-family: 'Newsreader', 'Iowan Old Style', 'Baskerville', 'Georgia', serif; font-size: 56px; font-weight: 500; fill: #293740; letter-spacing: -1.5px; }
      .lead { font-family: 'Aptos', 'Segoe UI Variable', -apple-system, sans-serif; font-size: 24px; fill: #52616A; line-height: 1.5; }
      .name { font-family: 'Aptos', 'Segoe UI Variable', -apple-system, sans-serif; font-size: 18px; font-weight: 650; fill: #984D3C; letter-spacing: 2px; }
      .role { font-family: 'Aptos', 'Segoe UI Variable', -apple-system, sans-serif; font-size: 26px; fill: #293740; font-weight: 550; }
      .quote { font-family: 'Newsreader', 'Georgia', serif; font-style: italic; font-size: 22px; fill: #984D3C; }
    </style>
  </defs>

  <!-- Warm background canvas -->
  <rect width="1200" height="630" fill="#F5F3EE"/>

  <!-- Subtle snowy surface card -->
  <rect x="48" y="48" width="1104" height="534" rx="16" fill="#FFFFFF" stroke="#E2EBEF" stroke-width="1.5"/>

  <!-- Identity line -->
  <text x="96" y="125" class="name">UNAI KALISTA URZAINQUI PÉREZ</text>
  <text x="96" y="165" class="role">Desarrolladora y fundadora de MKDL</text>

  <!-- Headline -->
  <text x="96" y="270" class="serif">Construir con ambición.</text>
  <text x="96" y="340" class="serif" fill="#984D3C">Proteger con sentido humano.</text>

  <!-- Lead -->
  <text x="96" y="420" class="lead">Desarrollo de tecnología y proyectos propios orientados a proteger</text>
  <text x="96" y="458" class="lead">a pequeñas organizaciones y entornos industriales que quedan fuera del foco.</text>

  <!-- Rule -->
  <line x1="96" y1="505" x2="1104" y2="505" stroke="#E8EFF2" stroke-width="1.5"/>

  <!-- Footer text -->
  <text x="96" y="545" class="quote">«El tamaño de una empresa no mide la importancia de lo que sostiene.»</text>
  <text x="960" y="545" font-family="'Aptos', sans-serif" font-size="17px" fill="#52616A">mysthrala.com</text>
</svg>
