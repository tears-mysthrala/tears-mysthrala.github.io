<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      .title { font-family: 'Aptos', 'Segoe UI Variable', -apple-system, sans-serif; font-size: 58px; font-weight: 600; fill: #202227; letter-spacing: -2px; }
      .lead { font-family: 'Aptos', 'Segoe UI Variable', -apple-system, sans-serif; font-size: 26px; fill: #60636a; }
      .tag { font-family: 'Aptos', 'Segoe UI Variable', -apple-system, sans-serif; font-size: 16px; font-weight: 650; fill: #3d3049; letter-spacing: 2px; }
      .mono { font-family: monospace; font-size: 20px; fill: #a15538; font-weight: 600; }
    </style>
  </defs>

  <!-- Paper background -->
  <rect width="1200" height="630" fill="#ecebea"/>

  <!-- Border & Margins -->
  <rect x="48" y="48" width="1104" height="534" fill="#f6f5f3" stroke="#c9c7c4" stroke-width="1.5"/>

  <!-- Top Context -->
  <text x="96" y="120" class="tag">BAJO DEBA · EUSKADI / KALISTA</text>

  <!-- Title -->
  <text x="96" y="240" class="title">Kalista — Tears Mysthrala</text>
  <text x="96" y="310" font-family="'Aptos', 'Segoe UI Variable', sans-serif" font-size="34px" font-weight="520" fill="#a15538">
    Fundadora &amp; Desarrolladora de Sistemas
  </text>

  <!-- Lead -->
  <text x="96" y="385" class="lead">Ciberseguridad industrial, criterio de negocio y defensa operativa.</text>
  <text x="96" y="425" class="lead">Software local-first, análisis forense DFIR y resiliencia en planta.</text>

  <!-- Rule -->
  <line x1="96" y1="480" x2="1104" y2="480" stroke="#c9c7c4" stroke-width="1"/>

  <!-- Footer Info -->
  <text x="96" y="530" class="mono">mysthrala.com</text>
  <text x="420" y="530" font-family="'Aptos', sans-serif" font-size="18px" fill="#60636a">Rigor Demostrable · Local-First · Control Humano</text>
  <text x="940" y="530" font-family="'Aptos', sans-serif" font-size="18px" fill="#202227">Castellano · Euskara · English</text>
</svg>
